name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install epg2xml
        run: |
          python -m pip install --upgrade pip
           python -m pip install git+https://github.com/epg2xml/epg2xml.git
          python -m pip install curl_cffi
      - name: Generate EPG
        run: |
          epg2xml \
            --config epg2xml_bulk_config.json \
            --channelfile Channel.json \
            --xmlfile epg.xml \
            run
      - name: Merge Korean EPG
        run: |
          python - <<'PY'
          import copy
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          url = "https://raw.githubusercontent.com/kenpark76/kenpark76.github.io/main/koreatvEPG.xml"

          with urllib.request.urlopen(url, timeout=60) as r:
              src = ET.fromstring(r.read())

          target = Path("epg.xml")
          text = target.read_text(encoding="utf-8")

          id_map = {
              "501.lg": "KBS1.kr",
              "181.lg": "KBS2.kr",
              "503.lg": "MBC.kr",
              "504.lg": "SBS.kr",
                          "619.lg": "KBSJoy.kr",
            "617.lg": "KBSDrama.kr",
            "620.lg": "KBSStory.kr",
            "582.lg": "KBSLIFE.kr",
            "626.lg": "MBCEvery1.kr",
            "623.lg": "MBCON.kr",
            "624.lg": "MBCM.kr",
            "611.lg": "MBCNnet.kr",
            "612.lg": "SBSPlus.kr",
            "616.lg": "SBSBiz.kr",
            "615.lg": "SBSfunE.kr",
            "739.lg": "SBSF!L.kr",
            "614.lg": "SBSGolf.kr",
            "635.lg": "SBSGolf2.kr",
            "613.lg": "SBS스포츠.kr",
            "506.lg": "EBS2.kr",
            "420.sk": "tbSTV.kr",
                          "C01582.tving": "JTBC.kr",
            "C00708.tving": "MBN.kr",
            "C01583.tving": "채널A.kr",
            "C00551.tving": "tvN.kr",
            "C00579.tving": "Mnet.kr",
            "C01143.tving": "tvNDrama.kr",
            "C01141.tving": "tvNShow.kr",
            "C00593.tving": "YTN.kr",
            "C01723.tving": "KRBD1400001ED",
            "C01101.tving": "YTN2.kr",
            "C15741.tving": "JTBC2.kr",
            "C22041.tving": "JTBC4.kr",
            "C51258.tving": "tvNStory.kr",
            "C17141.tving": "채널A플러스.kr",
            "C00544.tving": "중화TV.kr",
                        "C51263.tving": "AUTO.국회방송",
          "C01581.tving": "TV조선.kr"}

          channels = []
          programmes = []

          for old_id, new_id in id_map.items():
              ch = src.find(f"./channel[@id='{old_id}']")
              if ch is None:
                  raise SystemExit(f"Missing channel: {old_id}")

              new_ch = copy.deepcopy(ch)
              new_ch.set("id", new_id)
              channels.append(ET.tostring(new_ch, encoding="unicode"))

              ps = src.findall(f"./programme[@channel='{old_id}']")
              if not ps:
                  raise SystemExit(f"No programmes: {old_id}")

              for p in ps:
                  new_p = copy.deepcopy(p)
                  new_p.set("channel", new_id)
                  programmes.append(ET.tostring(new_p, encoding="unicode"))

          pos = text.find("<programme")
          text = text[:pos] + "\n".join(channels) + "\n" + text[pos:]

          pos = text.rfind("</tv>")
          text = text[:pos] + "\n".join(programmes) + "\n" + text[pos:]

          target.write_text(text, encoding="utf-8")

          print("추가 채널:", len(channels))
          print("추가 편성표:", len(programmes))
          PY
      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml Channel.json
          if ! git diff --cached --quiet; then
            git commit -m "Update EPG"
            git push
          else
            echo "No changes to commit"
          fi
