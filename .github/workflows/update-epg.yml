name: Update EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install epg2xml
        run: |
          python -m pip install --upgrade pip
          python -m pip install "epg2xml[curl] @ git+https://github.com/epg2xml/epg2xml.git""

      - name: Generate EPG
        run: |
          epg2xml \
            --config epg2xml_bulk_config.json \
            --channelfile Channel.json \
            --xmlfile epg.xml \
            run

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg.xml Channel.json
          if ! git diff --cached --quiet; then
            git commit -m "Update EPG"
            git push
          else
            echo "No changes to commit"
          fi
